name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Pre-fetch CloudStream Core JAR
        run: |
          mkdir -p ~/.gradle/caches/cloudstream/cloudstream ~/.gradle/caches/cloudstream
          if [ -f "$GITHUB_WORKSPACE/src/libs/cloudstream.jar" ]; then
            echo "Using bundled libs/cloudstream.jar..."
            cp -f "$GITHUB_WORKSPACE/src/libs/cloudstream.jar" ~/.gradle/caches/cloudstream/cloudstream.jar
            cp -f "$GITHUB_WORKSPACE/src/libs/cloudstream.jar" ~/.gradle/caches/cloudstream/cloudstream/cloudstream.jar
          else
            echo "Resolving CloudStream classes.jar from GitHub API..."
            ASSET_URL=$(python3 -c "import urllib.request, json; req=urllib.request.Request('https://api.github.com/repos/recloudstream/cloudstream/releases/tags/pre-release', headers={'User-Agent': 'curl'}); data=json.load(urllib.request.urlopen(req)); print(next(a['url'] for a in data['assets'] if a['name']=='classes.jar'))")
            echo "Downloading classes.jar from: $ASSET_URL"
            curl -sL -H "Accept: application/octet-stream" -H "User-Agent: curl" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$ASSET_URL" -o ~/.gradle/caches/cloudstream/cloudstream.jar
            cp -f ~/.gradle/caches/cloudstream/cloudstream.jar ~/.gradle/caches/cloudstream/cloudstream/cloudstream.jar
          fi
          ls -lh ~/.gradle/caches/cloudstream/cloudstream.jar ~/.gradle/caches/cloudstream/cloudstream/cloudstream.jar

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          gradle make makePluginsJson
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \; || echo "No .cs3 files found"
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/ || echo "No plugins.json found"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if [[ -n $(git status -s) ]]; then
            git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA"
            git push --force
          else
            echo "No changes to push"
          fi
